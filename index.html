<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eng. Mahmoud Hezza | ShipOpt</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7ff;
    --ink:#0c2a5e;
    --ink-soft:#4a5c7d;
    --blue:#1d5fe0;
    --blue-2:#3b82f6;
    --navy:#0a2350;
    --gold:#e0a526;
    --glass:rgba(255,255,255,.55);
    --glass-border:rgba(255,255,255,.7);
    --shadow:0 20px 50px -20px rgba(12,42,94,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Tajawal","Inter",system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow-x:hidden;
    line-height:1.6;
  }
  body::before,body::after{
    content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55;
    animation:drift 18s ease-in-out infinite alternate;
  }
  body::before{width:520px;height:520px;background:#9cc1ff;top:-120px;right:-120px}
  body::after{width:460px;height:460px;background:#ffd98a;bottom:-120px;left:-120px;animation-delay:-6s}
  @keyframes drift{to{transform:translate(60px,40px) scale(1.08)}}

  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}
  h1,h2,h3{font-weight:800;line-height:1.3}
  .tag{
    display:inline-block;font-family:"Inter",sans-serif;font-size:12px;font-weight:600;
    letter-spacing:.04em;color:var(--blue);background:rgba(29,95,224,.08);
    padding:6px 14px;border-radius:999px;margin-bottom:18px;
  }
  section{padding:96px 0}
  .section-head{text-align:center;margin-bottom:44px}
  .section-head h2{font-size:clamp(26px,3.6vw,38px);margin-bottom:10px}
  .section-head p{color:var(--ink-soft);font-size:17px;max-width:600px;margin:0 auto}

  .glass{
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:22px;
    box-shadow:var(--shadow);
  }

  .reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .reveal[data-delay="1"]{transition-delay:.12s}
  .reveal[data-delay="2"]{transition-delay:.24s}

  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(244,247,255,.6);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.6);
  }
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-family:"Inter",sans-serif;font-weight:800;font-size:20px;color:var(--ink);letter-spacing:-.01em}
  .logo span{color:var(--blue)}
  .lang{
    font-family:"Inter",sans-serif;font-size:13px;font-weight:600;color:var(--blue);
    border:1px solid rgba(29,95,224,.35);background:transparent;border-radius:999px;
    padding:6px 16px;cursor:pointer;transition:background .25s,color .25s;
  }
  .lang:hover{background:var(--blue);color:#fff}

  .hero{padding:72px 0 40px;text-align:center}
  .site-name{
    font-family:"Inter",sans-serif;font-weight:800;
    font-size:clamp(56px,11vw,120px);line-height:1;letter-spacing:-.03em;
    color:var(--ink);margin-bottom:14px;
  }
  .site-name span{color:var(--blue)}
  .site-tagline{
    font-family:"Inter",sans-serif;font-size:19px;font-weight:500;
    color:var(--ink-soft);max-width:680px;margin:0 auto 34px;line-height:1.6;
  }
  .explainer{max-width:820px;margin:0 auto 56px}
  .explainer .video-frame{margin-bottom:22px}
  .explainer-lead{font-size:20px;font-weight:600;color:var(--ink);margin-bottom:18px;line-height:1.7}
  .video-label{font-weight:700;font-size:16px;color:var(--blue);margin:2px 4px 12px}
  .hero h1{font-size:clamp(32px,5.2vw,58px);margin-bottom:18px;letter-spacing:-.01em}
  .hero h1 em{font-style:normal;color:var(--blue);position:relative;display:inline-block}
  .hero h1 em::after{
    content:"";position:absolute;inset:auto 0 4px 0;height:10px;background:rgba(224,165,38,.35);
    z-index:-1;border-radius:6px;transform:scaleX(0);transform-origin:right;
    animation:underline .9s .6s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes underline{to{transform:scaleX(1)}}
  .hero p.lead{color:var(--ink-soft);font-size:18px;max-width:560px;margin:0 auto 30px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--blue);color:#fff;text-decoration:none;font-weight:700;font-size:16px;
    padding:14px 30px;border-radius:14px;box-shadow:0 12px 28px -10px rgba(29,95,224,.6);
    transition:transform .25s,box-shadow .25s;
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 18px 34px -10px rgba(29,95,224,.7)}

  .scene{position:relative;height:260px;margin:48px auto 0;max-width:720px}
  .sun{position:absolute;left:50%;top:0;width:300px;height:300px;transform:translateX(-50%);
    border-radius:50%;background:radial-gradient(circle,#dbe8ff 0%,rgba(219,232,255,0) 70%);
    animation:pulse 6s ease-in-out infinite}
  @keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
  .ship{position:absolute;left:50%;top:40px;width:420px;transform:translateX(-50%);animation:bob 4s ease-in-out infinite}
  @keyframes bob{50%{transform:translate(-50%,-8px)}}
  .sea{position:absolute;bottom:0;left:0;right:0;height:60px;overflow:hidden}
  .sea svg{position:absolute;bottom:0;width:200%;height:100%;animation:wave 8s linear infinite}
  @keyframes wave{to{transform:translateX(-50%)}}

  .why-grid{display:grid;gap:18px}
  .why-card{padding:26px 28px;display:flex;gap:18px;align-items:flex-start;transition:transform .35s,box-shadow .35s}
  .why-card:hover{transform:translateY(-4px);box-shadow:0 26px 60px -22px rgba(12,42,94,.35)}
  .num{
    flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;font-weight:800;
    font-family:"Inter",sans-serif;box-shadow:0 8px 18px -8px rgba(29,95,224,.7);
  }
  .why-card h3{font-size:20px;margin-bottom:4px}
  .why-card p{color:var(--ink-soft);font-size:16px}

  .stages{display:grid;gap:20px;grid-template-columns:1fr}
  @media(min-width:760px){.stages{grid-template-columns:1fr 1fr}}
  .stage{padding:32px 30px;color:#fff;position:relative;overflow:hidden;border:none}
  .stage.s1{background:linear-gradient(160deg,#0f2f6e,var(--navy))}
  .stage.s2{background:linear-gradient(160deg,#2b6ff0,#1d5fe0)}
  .stage::before{
    content:"";position:absolute;width:220px;height:220px;border-radius:50%;
    background:rgba(255,255,255,.08);top:-80px;left:-60px;animation:drift 12s ease-in-out infinite alternate;
  }
  .stage h3{font-size:22px;margin-bottom:18px;position:relative}
  .stage ul{list-style:none;position:relative}
  .stage, .stage *{color:#fff}
  .stage li{
    padding:12px 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:16px;
    animation:slideIn .6s cubic-bezier(.2,.7,.2,1) both;
  }
  .stage li:nth-child(1){animation-delay:.15s}
  .stage li:nth-child(2){animation-delay:.25s}
  .stage li:nth-child(3){animation-delay:.35s}
  .stage li:nth-child(4){animation-delay:.45s}
  .stage li:nth-child(5){animation-delay:.55s}
  @keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
  .stage li:last-child{border-bottom:none}
  .stage li strong{display:block;font-size:17px;font-weight:700;margin-bottom:2px}
  .stage li p{font-size:14.5px;opacity:.85;line-height:1.6}

  .stats{display:grid;gap:18px;grid-template-columns:1fr}
  @media(min-width:760px){.stats{grid-template-columns:repeat(3,1fr)}}
  .stat{text-align:center;padding:34px 20px}
  .stat .val{font-family:"Inter",sans-serif;font-size:44px;font-weight:800;color:var(--blue);letter-spacing:-.02em}
  .stat .lbl{color:var(--ink-soft);font-size:15px;margin-top:6px}
  .stat .sub{color:#8a98b4;font-size:13px;margin-top:4px}

  .tradeoff{padding:36px 34px}
  .tradeoff .labels{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:14px}
  .tradeoff .labels .safe{color:#1a8a5b}
  .tradeoff .labels .eco{color:#b7791f}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:999px;outline:none;
    background:linear-gradient(90deg,#27a072,var(--blue) 50%,var(--gold));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;
    border:4px solid var(--blue);cursor:pointer;box-shadow:0 4px 12px rgba(12,42,94,.3);
    transition:transform .2s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--blue);cursor:pointer}
  .readouts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
  .readout{background:rgba(255,255,255,.7);border-radius:16px;padding:18px;text-align:center}
  .readout .v{font-family:"Inter",sans-serif;font-size:32px;font-weight:800;color:var(--blue)}
  .readout .l{font-size:14px;color:var(--ink-soft)}
  .note{font-size:13px;color:#8a98b4;text-align:center;margin-top:16px}

  .video-frame{padding:14px;overflow:hidden}
  .video-frame video{width:100%;display:block;border-radius:14px;background:var(--navy);aspect-ratio:16/9;position:relative;z-index:1}

  footer{
    margin-top:40px;background:rgba(10,35,80,.92);color:#dbe6ff;text-align:center;padding:36px 20px;
    backdrop-filter:blur(10px);
  }
  footer b{font-family:"Inter",sans-serif;color:#fff}
  footer small{display:block;margin-top:6px;opacity:.7}

  .wa-float{
    position:fixed;bottom:24px;left:24px;z-index:60;
    width:60px;height:60px;border-radius:50%;
    background:#25d366;display:grid;place-items:center;
    box-shadow:0 12px 28px -8px rgba(37,211,102,.7);
    transition:transform .25s,box-shadow .25s;
    animation:float 3s ease-in-out infinite;
  }
  .wa-float:hover{transform:scale(1.08);box-shadow:0 16px 34px -8px rgba(37,211,102,.8)}
  @keyframes float{50%{transform:translateY(-5px)}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>

  let currentLang = 'ar';

  function applyLang(l){
    const d = T[l];
    currentLang = l;
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    document.title = d.title;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.innerHTML = d[el.dataset.i18n];
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => {
      el.setAttribute('aria-label', d[el.dataset.i18nAria]);
    });
    document.getElementById('langBtn').textContent = d.langBtn;
  }

  applyLang('ar');

  document.getElementById('langBtn').addEventListener('click', () => {
    applyLang(currentLang === 'ar' ? 'en' : 'ar');
  });

  // Scroll reveal
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  // Count-up numbers
  const fmt = n => n.toLocaleString('en-US');
  const countIO = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target;
      const target = +el.dataset.count;
      const plus = el.dataset.plus ? '+' : '';
      const dur = 1400;
      const start = performance.now();
      const step = now => {
        const p = Math.min((now - start) / dur, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(Math.round(target * eased)) + (p === 1 ? plus : '');
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
      countIO.unobserve(el);
    });
  }, { threshold: 0.6 });
  document.querySelectorAll('[data-count]').forEach(el => countIO.observe(el));

  // Safety vs economy slider (illustrative values only)
  const slider = document.getElementById('tradeoff');
  const safety = document.getElementById('safety');
  const econ = document.getElementById('econ');
  const update = () => {
    const v = +slider.value;
    safety.textContent = Math.round(70 + (v - 50) * 0.2) + '%';
    econ.textContent = Math.round(68 - (v - 50) * 0.15) + '%';
  };
  slider.addEventListener('input', update);
  update();

  // Stage cards
  document.querySelectorAll('.stage').forEach(el => {
    const o = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); o.unobserve(e.target); } });
    }, { threshold: 0.3 });
    o.observe(el);
  });
</script>
